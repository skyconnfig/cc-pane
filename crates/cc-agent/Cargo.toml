[package]
name = "cc-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
strum = { version = "0.26", features = ["derive"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
thiserror = "1"
async-trait = "0.1"

[dev-dependencies]
pretty_assertions = "1"
